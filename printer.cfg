#####################################################################
#   Macros
#####################################################################
[include KAMP_Settings.cfg]
[include ./KAMP/Voron_Purge.cfg]
[include ./KAMP/Smart_Park.cfg]
[include moonraker_obico_macros.cfg]
[include nozzle_scrub.cfg]
[include nevermore.cfg]
[include nitehawk-36.cfg]

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30


[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32


#[gcode_macro M141]
#gcode:
#    {% set s = params.S|default(0)|float %}
#    NEVERMORE_TEMPERATURE_WAIT MINIMUM={s}
#

[gcode_macro list_sensors]
gcode:
  { action_respond_info(printer.heaters.available_heaters | join(', ')) }
  { action_respond_info(printer.heaters.available_sensors | join(', ')) }


#####################################################################
#   Macro: Temperature Wait
#
#   Replace M109 (wait for hotend temperature) and M190 (wait for bed
#   temperature) with TEMPERATURE_WAIT.
#
#   This just makes Klipper resume immediately after reaching temp. Otherwise
#   it waits for the temperature to stabilize.
#####################################################################
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}


[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}


#####################################################################
#   Macro: Print Start
#####################################################################
[gcode_macro PRINT_START]
gcode:
    # Parameters
    {% set th = printer.toolhead %}
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.HOTEND|int %}
    {% set chambertemp = params.CHAMBER|default(0)|int %}

    # Start Routine
    STATUS_READY
    M107                           ; turn off parts fan
    SET_GCODE_OFFSET Z=0           ; clear any previous z offset

    STATUS_HOMING
    G28                            ; home all axes (will use contact mode on first home per config)

    # Set Bed and Chamber Temp (do this before heating nozzle to save time)
    STATUS_HEATING
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    SET_FAN_SPEED FAN=nevermore_circulator SPEED=0.8
    M190 S{bedtemp}                ; set & wait for bed temp
    M141 S{chambertemp}            ; chamber heating
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={chambertemp}  ; wait for chamber temp
    M109 S150                      ; heat to 150C and wait

    # Clean nozzle immediately before contact operations (best practice)
    STATUS_CLEANING
    CLEAN_NOZZLE                      ; wipe only (too cold to purge, prevents ooze contamination)
    G28 Z METHOD=CONTACT CALIBRATE=1  ; calibrate z offset and beacon model hot

    # Quad gantry leveling with proximity scanning (already calibrated from G28)
    STATUS_LEVELING
    QUAD_GANTRY_LEVEL PROBE_METHOD=proximity

    # Fast bed mesh using proximity/eddy current scanning (no nozzle contact)
    STATUS_MESHING
    BED_MESH_CALIBRATE PROBE_METHOD=proximity RUNS=2

    # Re-home Z after leveling
    STATUS_CLEANING
    CLEAN_NOZZLE                   ; wipe only (too cold to purge, prevents ooze contamination)
    STATUS_HOMING
    G28 Z METHOD=CONTACT CALIBRATE=0

    # Heat to final print temperature before bed mesh
    STATUS_HEATING
    G0 X{th.axis_maximum.x//2 - 40} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M109 S{hotendtemp}             ; heat to print temp

    # Final nozzle clean with purge (now hot enough)
    STATUS_CLEANING
    CLEAN_NOZZLE                   ; purge and wipe before meshing

    #SET_GCODE_OFFSET Z=0.10        ; add a little offset for hotend thermal expansion
                                   ; needs fine tuning, long meltzones require more
    #SET_GCODE_OFFSET Z_ADJUST={OFFSET}  ; apply optional material squish via slicer

    SKEW_PROFILE LOAD=Calilantern5
    G90                            ; absolute positioning
    VORON_PURGE
    STATUS_READY


#####################################################################
#   Macro: Print End
#####################################################################
[gcode_macro PRINT_END]
gcode:
    M141 S35  ; Cool down chamber

    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-1.0 F2700                 ; retract a bit fast
    G1 E-4.0 F1800                 ; retract more slowly (5mm total)
    TURN_OFF_HEATERS

    G90                                                        ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000                    ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                                       ; turn off fan

    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180
    STATUS_DONE


