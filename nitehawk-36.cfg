# This file contains pin mappings for the LDO Nitehawk-36 Toolboard
# To use this config, the firmware should be compiled for the Raspberry Pi RP2040
# Make sure to include this config *at the end* of printer.cfg to overwrite the relevent sections

# See https://docs.ldomotors.com/en/Toolboard/nitehawk-36#firmware-setup-and-update
# For instructions on uploading/updating klipper firmware to the PCB

## LDO Nitehawk-SB Toolboard Partial Config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] sections

## *MAKE SURE* to include this partial config file *AFTER* the main controller config. 
## This will ensure the relavent sections are overwritten by the pin mappings specified here.

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_32323232361934F3-if00
restart_method: command
##--------------------------------------------------------------------

#####################################################################
#   Endstops
#####################################################################
## XES - Toolhead PCB
#[stepper_x]
#endstop_pin: nhk:gpio13


#####################################################################
#   Filament Sensor
#####################################################################
# Sensor 1 (GPIO3) - Pre-extruder sensor
[filament_switch_sensor filament_sensor_pre]
switch_pin: !nhk:gpio13
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M118 Filament runout detected by pre-extruder sensor!
    M117 Filament runout (pre-extruder)
insert_gcode:
    M118 Filament inserted in pre-extruder sensor
    M117 Run LOAD_FILAMENT, then RESUME

# Sensor 2 (GPIO13) - Post-extruder sensor
[filament_switch_sensor filament_sensor_post]
switch_pin: !nhk:gpio3
pause_on_runout: False
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    M118 Filament runout detected by post-extruder sensor!
    M117 Filament runout (post-extruder)
insert_gcode:
    M118 Filament inserted in post-extruder sensor
    M117 Filament detected

#####################################################################
#     Extruder
#####################################################################
[extruder]
step_pin: nhk:gpio23
dir_pin: nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: nhk:gpio9
sensor_pin: nhk:gpio29
pullup_resistor: 2200

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6        #recommend setting it below 0.7A.

#####################################################################
#   Fans
#####################################################################
## PCF
[fan]
pin: nhk:gpio6
off_below: 0.10


## HEF
[heater_fan hotend_fan]
pin: nhk:gpio5
max_power: 1.0
heater: extruder
heater_temp: 50.0
tachometer_pin: nhk:gpio16
tachometer_ppr: 2

#####################################################################
#     Probe
#####################################################################
## Probe Port
[probe]
# pin: nhk:gpio10  # using the beacon probe instead!

#####################################################################
#   Lights
#####################################################################
##Stealthburner Headlights
[neopixel sb_leds]
pin: nhk:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 0.0
initial_BLUE: 1.0
initial_WHITE: 0.0

## PCB Activity Light
[output_pin act_led]
pin: !nhk:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345]
cs_pin: nhk:gpio27
spi_software_sclk_pin: nhk:gpio18
spi_software_mosi_pin: nhk:gpio20
spi_software_miso_pin: nhk:gpio19

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
probe_points:
    175, 175, 20

#####################################################################
#   Addtional Sensors
#####################################################################
[temperature_sensor NH36]
sensor_type: temperature_mcu
sensor_mcu: nhk
min_temp: 0
max_temp: 100


#####################################################################
#   Pause/Resume/Cancel Macros
#####################################################################
[gcode_macro PAUSE]
description: Pause the print and park the toolhead
rename_existing: BASE_PAUSE
gcode:
    {% set th = printer.toolhead %}
    {% set x_park = params.X|default(th.axis_maximum.x - 10)|float %}
    {% set y_park = params.Y|default(th.axis_maximum.y - 10)|float %}
    {% set z_lift = params.Z|default(25)|float %}
    {% set max_z = th.axis_maximum.z|float %}
    {% set cur_z = th.position.z|float %}
    {% set z_safe = [cur_z + z_lift, max_z]|min %}

    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    M118 Print paused
    G91                                 # Relative positioning
    G1 E-1 F2700                        # Retract a bit to reduce oozing
    G1 E-9 F600                         # Retract more slowly
    G90                                 # Absolute positioning
    G1 Z{z_safe} F600                   # Raise Z
    G1 X{x_park} Y{y_park} F20000       # Park toolhead
    M117 Print paused

[gcode_macro RESUME]
description: Resume the print after pause
rename_existing: BASE_RESUME
gcode:
    {% if printer.pause_resume.is_paused %}
        M118 Resuming print
        {% if printer.extruder.temperature < printer.extruder.target - 5 %}
            M118 Waiting for extruder to reach target temperature
            M109 S{printer.extruder.target}
        {% endif %}
        G91                             # Relative positioning
        G1 E10 F300                     # Extrude to prime nozzle
        G1 E10 F150                     # Extrude more slowly
        G90                             # Absolute positioning
        M117 Resuming print...
        RESTORE_GCODE_STATE NAME=PAUSE_state
        BASE_RESUME
    {% else %}
        M118 Print is not paused
    {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel the print
rename_existing: BASE_CANCEL_PRINT
gcode:
    M118 Cancelling print
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    G91                                 # Relative positioning
    G1 E-10 F600                        # Retract filament
    G1 Z10 F600                         # Raise Z
    G90                                 # Absolute positioning
    G1 X{printer.toolhead.axis_maximum.x//2} Y{printer.toolhead.axis_maximum.y - 5} F20000  # Park at rear
    M107                                # Turn off part cooling fan
    BED_MESH_CLEAR
    BASE_CANCEL_PRINT
    M117 Print cancelled
