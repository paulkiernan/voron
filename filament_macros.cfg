#####################################################################
#   Pause / Resume / Cancel + Filament Change Macros
#
#   PAUSE / RESUME / CANCEL_PRINT wrap Klipper's built-ins with
#   parking, retraction, heater management, and filament sensor
#   toggling. M600 (slicer color change) pauses and parks for a
#   manual swap via UNLOAD_FILAMENT / LOAD_FILAMENT.
#####################################################################

[pause_resume]

# Required for M117 messages in Mainsail (also used by the filament
# sensor insert/runout notifications in nitehawk-36.cfg)
[display_status]


#####################################################################
#   Macro: Pause
#####################################################################
# Parks front-center for toolhead access, hops Z, turns the hotend
# off (bed stays hot so the part keeps adhering), and extends the
# idle timeout so a long unattended pause doesn't kill the bed.
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set z = params.Z|default(10)|int %}  ; z hop amount
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}

        SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=0   ; don't retrigger during the swap
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=0

        SAVE_GCODE_STATE NAME=PAUSE
        BASE_PAUSE

        {% if printer.extruder.can_extrude %}
            M83
            G1 E-2 F2700               ; small retract to limit ooze
        {% endif %}

        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91
            G1 Z{z} F900               ; hop away from the print
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90
        G1 X{printer.toolhead.axis_maximum.x//2} Y{printer.toolhead.axis_minimum.y + 5} F6000
        SAVE_GCODE_STATE NAME=PAUSEPARK

        M104 S0                        ; hotend off so filament doesn't cook
        SET_IDLE_TIMEOUT TIMEOUT=43200 ; 12h — keep the bed hot while paused
        M117 Paused
    {% endif %}


#####################################################################
#   Macro: Resume
#####################################################################
# Reheats to the pre-pause temp, primes, and returns to the exact
# pause position before handing control back to the print.
[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set e = params.E|default(2.5)|int %}  ; prime amount
    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=1
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
        {% if etemp > 0 %}
            M109 S{etemp|int}          ; reheat to pre-pause temp
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100
        G91
        M83
        {% if printer.extruder.can_extrude %}
            G1 E{e} F900               ; prime
        {% else %}
            M117 Nozzle too cold to prime
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=100
        BASE_RESUME
        M117 Resuming
    {% endif %}


#####################################################################
#   Macro: Cancel Print
#####################################################################
# Cold-safe version of PRINT_END: skips the retract if the nozzle has
# cooled during a pause (a hard retract there would abort the macro
# and leave cleanup unfinished).
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    {% set th = printer.toolhead %}
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=1
    CLEAR_PAUSE
    M400
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-5 F1800
    {% endif %}
    TURN_OFF_HEATERS
    M141 S35                           ; cool down chamber
    M107                               ; part fan off
    {% if "xyz" in th.homed_axes %}
        G90
        G0 Z{[th.position.z + 10, th.axis_maximum.z]|min} F3600
        G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park rear
    {% endif %}
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180
    STATUS_READY
    M117 Print canceled
    BASE_CANCEL_PRINT


#####################################################################
#   Macro: M600 (Filament Change)
#####################################################################
# Emitted by the slicer for color changes; also usable manually.
# Pauses with extra Z clearance, then you run UNLOAD_FILAMENT,
# LOAD_FILAMENT, and RESUME.
[gcode_macro M600]
description: Filament change: pause, park, then UNLOAD/LOAD_FILAMENT + RESUME
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        M117 Already paused
    {% else %}
        PAUSE Z=25
        M117 UNLOAD_FILAMENT, LOAD_FILAMENT, then RESUME
    {% endif %}


#####################################################################
#   Macros: Load / Unload Filament
#####################################################################
# TEMP param overrides; otherwise uses the pre-pause temp when mid
# print, falling back to 250C (ABS/ASA territory).
[gcode_macro UNLOAD_FILAMENT]
description: Tip-shape and retract filament clear of the extruder
gcode:
    {% set target = params.TEMP|default(0)|int %}
    {% if target == 0 %}
        {% set target = printer["gcode_macro RESUME"].etemp|int %}
    {% endif %}
    {% if target < printer.configfile.settings.extruder.min_extrude_temp %}
        {% set target = 250 %}
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=0
    M109 S{target}
    M83
    G1 E10 F300                        ; soften and form tip
    G1 E-20 F3000                      ; quick pull out of the melt zone
    G1 E-50 F1500                      ; back out through the extruder
    M400
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=1
    {% endif %}
    M117 Filament unloaded

[gcode_macro LOAD_FILAMENT]
description: Feed filament into the hotend and purge
gcode:
    {% set target = params.TEMP|default(0)|int %}
    {% if target == 0 %}
        {% set target = printer["gcode_macro RESUME"].etemp|int %}
    {% endif %}
    {% if target < printer.configfile.settings.extruder.min_extrude_temp %}
        {% set target = 250 %}
    {% endif %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=0
    M109 S{target}
    M83
    G1 E50 F300                        ; feed through the extruder into the hotend
    G1 E30 F150                        ; slow purge to clear old color
    M400
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_pre ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=filament_sensor_post ENABLE=1
    {% endif %}
    M117 Loaded. RESUME when ready
